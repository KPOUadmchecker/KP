    ns=Math.min(MAP_SCALE_MAX, Math.max(MAP_SCALE_MIN, ns));
    const cx=(pinch.mx0-pinch.tx0)/pinch.s0;
    const cy=(pinch.my0-pinch.ty0)/pinch.s0;
    mapScale=ns;
    mapTX=mx-cx*ns;
    mapTY=my-cy*ns;
    if(mapScale>1) clampPan();
    applyMapTransform();
    e.preventDefault();
    return;
  }
  if(e.touches.length===1 && pan && mapScale>1){
    mapTX=pan.tx0+(e.touches[0].clientX-pan.x0);
    mapTY=pan.ty0+(e.touches[0].clientY-pan.y0);
    clampPan();
    applyMapTransform();
    e.preventDefault();
  }
}
function onMapTouchEnd(e){
  if(e.touches.length<2) pinch=null;
  if(e.touches.length===0){ pan=null; }
  else if(e.touches.length===1 && mapZoomReady && mapScale>1){
    pan={x0:e.touches[0].clientX, y0:e.touches[0].clientY, tx0:mapTX, ty0:mapTY};
  }
  if(mapScale<=1) applyMapTransform();
}
function reset(){cur=0; log=[]; lit=new Set(); trail=[]; pathIds=[]; history=[]; picking=false; mapScale=1; mapTX=0; mapTY=0; mapZoomReady=false; pinch=null; pan=null; document.getElementById("p").style.width="8%"; render();}
function validate(){
  QUESTIONS.forEach((q,qi)=>q.o.forEach(o=>{
    if(o.n!=null && !QUESTIONS[o.n]) console.error("跳題編號不存在", qi, o.l, o.n);
    if(o.r && !o.why) console.error("結果缺少 why", o.l);
    (o.id||[]).forEach(id=>{
      if(!EDGES.some(e=>String(e.on).includes(id))) console.warn("此 id 沒有對應引線", id);
    });
  }));
}
validate();
render();
</script>
